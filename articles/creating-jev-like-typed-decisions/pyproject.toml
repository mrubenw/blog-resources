[project]
name = "creating-jev-like-typed-decisions"
version = "0.1.0"
description = "Constraining an LLM to typed, verbalizer-based decisions (JEV-like structured outputs)"
requires-python = ">=3.9"

# --- pixi ---

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[tool.pixi.system-requirements]
macos = "14.0"

[tool.pixi.dependencies]
python = ">=3.9,<3.13"

[tool.pixi.pypi-dependencies]
torch = ">=2.0"
transformers = ">=4.40"
accelerate = ">=0.30"
jupyterlab = ">=4.0"
ipykernel = ">=6.0"

[tool.pixi.tasks]
notebook = "jupyter lab notebooks/"
