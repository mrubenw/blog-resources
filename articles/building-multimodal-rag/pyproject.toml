[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multimodal-rag"
version = "0.1.0"
description = "Building a Multimodal RAG Pipeline — food image search with CLIP, Milvus, and Claude"
requires-python = ">=3.9"

[tool.hatch.build.targets.wheel]
packages = ["src/multimodal_rag"]

# --- pixi ---

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[tool.pixi.dependencies]
python = ">=3.9,<3.13"

[tool.pixi.pypi-dependencies]
torch = ">=2.0"
torchvision = ">=0.15"
clip = { git = "https://github.com/openai/CLIP.git" }
anthropic = ">=0.40"
pymilvus = ">=2.4"
milvus-lite = ">=2.4"
datasets = ">=2.19"
pillow = ">=10.0"
matplotlib = ">=3.7"
tqdm = ">=4.65"
numpy = ">=1.24,<2.0"
python-dotenv = ">=1.0"
pytest = ">=8.0"
pytest-mock = ">=3.12"
jupyterlab = ">=4.0"
ipykernel = ">=6.0"
multimodal-rag = { path = ".", editable = true }

[tool.pixi.tasks]
test = "pytest tests/ -v"
notebook = "jupyter lab notebooks/"

# --- other tools ---

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
